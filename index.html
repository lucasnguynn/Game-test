<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NOVA STRIKE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --hud-cyan: #63f7ff;
    --hud-warn: #ffcc4d;
    --hud-danger: #ff5d7a;
    --panel-bg: rgba(2, 14, 28, 0.72);
  }
  body {
    background: radial-gradient(circle at 50% 20%, #071426 0%, #01030a 55%, #000 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  canvas {
    display: block;
    width: min(900px, 100vw);
    height: auto;
    max-height: calc(100vh - 96px);
    border: 1px solid rgba(99, 247, 255, 0.28);
    border-radius: 14px;
    box-shadow: 0 0 42px rgba(0, 255, 255, 0.28), 0 0 96px rgba(0, 80, 255, 0.18);
    background: #020612;
  }
  #ui {
    position: fixed;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    width: min(900px, calc(100vw - 32px));
    display: grid;
    grid-template-columns: 1.25fr repeat(3, auto);
    gap: 10px;
    color: var(--hud-cyan);
    font-size: clamp(12px, 1.8vw, 15px);
    letter-spacing: 0.04em;
    text-shadow: 0 0 8px rgba(99, 247, 255, 0.8);
    pointer-events: none;
    z-index: 10;
  }
  #ui span {
    min-height: 32px;
    padding: 7px 12px;
    border: 1px solid rgba(99, 247, 255, 0.22);
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(7, 35, 61, 0.82), var(--panel-bg));
    box-shadow: inset 0 0 18px rgba(99, 247, 255, 0.08), 0 6px 18px rgba(0, 0, 0, 0.28);
    white-space: nowrap;
  }
  #brand-ui { font-weight: 700; }
  #lives-ui { color: var(--hud-danger); text-shadow: 0 0 8px rgba(255, 93, 122, 0.85); }
  #controls {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: min(900px, calc(100vw - 32px));
    color: rgba(235, 250, 255, 0.72);
    font-size: clamp(11px, 1.6vw, 13px);
    line-height: 1.45;
    text-align: center;
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    background: rgba(0,0,0,0.42);
    backdrop-filter: blur(6px);
  }
  @media (max-width: 640px) {
    #ui { grid-template-columns: 1fr 1fr; top: 8px; }
    #ui span { padding-inline: 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    canvas { box-shadow: 0 0 24px rgba(0, 255, 255, 0.18); }
  }
</style>
</head>
<body>

<div id="ui" role="status" aria-live="polite">
  <span id="brand-ui">⚡ NOVA STRIKE</span>
  <span id="score-ui">SCORE: 0</span>
  <span id="level-ui">WAVE: 1</span>
  <span id="lives-ui">❤ ❤ ❤</span>
</div>

<canvas id="c" aria-label="NOVA STRIKE game area"></canvas>

<div id="controls">
  🖱 MOVE MOUSE to steer &nbsp;|&nbsp; CLICK / SPACE to fire &nbsp;|&nbsp; P to pause
</div>

<script>
// ═══════════════════════════════════════════════════════
//  NOVA STRIKE — High Graphics Canvas Game
// ═══════════════════════════════════════════════════════

const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');

const W = 900;
const H = 650;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = Math.floor(W * DPR);
canvas.height = Math.floor(H * DPR);
canvas.style.width = `${W}px`;
canvas.style.height = `${H}px`;
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
ctx.imageSmoothingEnabled = false;

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const quality = {
  bloom: !prefersReducedMotion,
  maxParticles: prefersReducedMotion ? 140 : 260,
  shadowScale: prefersReducedMotion ? 0.45 : 1,
};

const ui = {
  score: document.getElementById('score-ui'),
  wave: document.getElementById('level-ui'),
  lives: document.getElementById('lives-ui'),
};

// ── State
let score = 0, lives = 3, wave = 1, paused = false;
let gameOver = false, gameStarted = false;
let frameCount = 0;
let shakeX = 0, shakeY = 0, shakeDuration = 0;
let flashAlpha = 0;

// ── Input
const keys  = {};
const mouse = { x: W / 2, y: H - 100, firing: false };

window.addEventListener('keydown',  e => {
  keys[e.code] = true;
  if (e.code === 'KeyP') paused = !paused;
  if (e.code === 'Space') { mouse.firing = true; e.preventDefault(); }
  if (!gameStarted && e.code === 'Enter') startGame();
  if (gameOver && e.code === 'Enter') resetGame();
});
window.addEventListener('keyup',    e => {
  keys[e.code] = false;
  if (e.code === 'Space') mouse.firing = false;
});
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
canvas.addEventListener('mousedown', () => mouse.firing = true);
canvas.addEventListener('mouseup',   () => mouse.firing = false);

// ─────────────────────────────────────────────
//  STARFIELD (3 layers for parallax)
// ─────────────────────────────────────────────
const starLayers = [
  Array.from({ length: 80  }, () => createStar(0.3, 1.2)),
  Array.from({ length: 50  }, () => createStar(0.6, 2.0)),
  Array.from({ length: 25  }, () => createStar(1.0, 3.0)),
];
const nebulae = Array.from({ length: 5 }, () => ({
  x: Math.random() * W, y: Math.random() * H,
  r: 80 + Math.random() * 120,
  color: `hsla(${Math.random() * 60 + 200}, 80%, 50%, 0.04)`
}));

function createStar(speed, size) {
  return { x: Math.random() * W, y: Math.random() * H, speed, size };
}
function updateStars() {
  starLayers.forEach(layer => layer.forEach(s => {
    s.y += s.speed;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }));
}
function drawStars() {
  // Nebula
  nebulae.forEach(n => {
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    g.addColorStop(0, n.color);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fill();
  });
  // Stars
  starLayers.forEach((layer, li) => {
    layer.forEach(s => {
      const alpha = 0.4 + li * 0.25 + Math.sin(frameCount * 0.03 + s.x) * 0.1;
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * 0.5, 0, Math.PI * 2);
      ctx.fill();
    });
  });
}

// ─────────────────────────────────────────────
//  PARTICLES
// ─────────────────────────────────────────────
const particles = [];

function spawnParticles(x, y, count, config = {}) {
  const budget = Math.max(0, quality.maxParticles - particles.length);
  const spawnCount = Math.min(count, budget);
  for (let i = 0; i < spawnCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (config.minSpeed || 1) + Math.random() * (config.maxSpeed || 4);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      decay: (config.decay || 0.02) + Math.random() * 0.015,
      size: (config.size || 3) + Math.random() * 3,
      color: config.color || `hsl(${Math.random() * 40 + 20},100%,60%)`,
      glow: config.glow !== false,
      trail: config.trail || false,
      px: x, py: y,
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.px = p.x; p.py = p.y;
    p.x  += p.vx;
    p.y  += p.vy;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    const a = Math.max(0, p.life);
    if (p.glow) {
      ctx.shadowBlur = 12 * quality.shadowScale;
      ctx.shadowColor = p.color;
    }
    if (p.trail) {
      ctx.strokeStyle = p.color.replace(')', `, ${a})`).replace('hsl', 'hsla');
      ctx.lineWidth = p.size * a;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle   = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha  = 1;
    ctx.shadowBlur   = 0;
  });
}

// ─────────────────────────────────────────────
//  PLAYER
// ─────────────────────────────────────────────
const player = {
  x: W / 2, y: H - 90,
  w: 40, h: 50,
  speed: 6,
  hp: 100, maxHp: 100,
  fireRate: 8,
  fireCooldown: 0,
  invincible: 0,
  trail: [],
  powerUp: null, powerUpTimer: 0,
};

function drawPlayer() {
  const { x, y } = player;

  // Trail
  player.trail.forEach((t, i) => {
    const a = (i / player.trail.length) * 0.4;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#0af';
    ctx.shadowBlur = 10 * quality.shadowScale;
    ctx.shadowColor = '#0af';
    ctx.beginPath();
    ctx.arc(t.x, t.y + 15, 5 * a, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  if (player.invincible > 0 && frameCount % 6 < 3) {
    ctx.globalAlpha = 0.4;
  }

  // Engine glow
  const eg = ctx.createRadialGradient(x, y + 28, 0, x, y + 28, 25);
  eg.addColorStop(0, 'rgba(0, 150, 255, 0.9)');
  eg.addColorStop(1, 'rgba(0, 100, 255, 0)');
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.ellipse(x, y + 28, 16, 22, 0, 0, Math.PI * 2); ctx.fill();

  // Ship body
  ctx.shadowBlur = 20 * quality.shadowScale;
  ctx.shadowColor = '#0ff';

  ctx.fillStyle = '#0af';
  ctx.beginPath();
  ctx.moveTo(x, y - 24);
  ctx.lineTo(x - 20, y + 24);
  ctx.lineTo(x - 8, y + 14);
  ctx.lineTo(x, y + 20);
  ctx.lineTo(x + 8, y + 14);
  ctx.lineTo(x + 20, y + 24);
  ctx.closePath();
  ctx.fill();

  // Cockpit
  const cg = ctx.createRadialGradient(x, y - 8, 0, x, y - 8, 10);
  cg.addColorStop(0, '#aff');
  cg.addColorStop(1, '#058');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.ellipse(x, y - 8, 7, 10, 0, 0, Math.PI * 2); ctx.fill();

  // Wing accents
  ctx.strokeStyle = '#0ff';
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(x - 18, y + 20);
  ctx.lineTo(x - 10, y);
  ctx.moveTo(x + 18, y + 20);
  ctx.lineTo(x + 10, y);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ─────────────────────────────────────────────
//  BULLETS
// ─────────────────────────────────────────────
const bullets = [], enemyBullets = [];

function spawnBullet() {
  if (player.fireCooldown > 0) return;
  player.fireCooldown = player.fireRate;

  const spread = player.powerUp === 'spread';
  const rapid  = player.powerUp === 'rapid';

  if (spread) {
    [-20, 0, 20].forEach(angle => {
      const rad = (angle * Math.PI) / 180;
      bullets.push({ x: player.x, y: player.y - 24, vx: Math.sin(rad) * 7, vy: -12, life: 1 });
    });
  } else {
    bullets.push({ x: player.x - 8, y: player.y - 24, vx: 0, vy: -14, life: 1 });
    bullets.push({ x: player.x + 8, y: player.y - 24, vx: 0, vy: -14, life: 1 });
    if (rapid) bullets.push({ x: player.x, y: player.y - 30, vx: 0, vy: -16, life: 1 });
  }

  spawnParticles(player.x, player.y - 24, 4, {
    color: '#0ff', size: 2, decay: 0.07, maxSpeed: 2, minSpeed: 0.5
  });
}

function drawBullets() {
  bullets.forEach(b => {
    ctx.shadowBlur  = 15 * quality.shadowScale;
    ctx.shadowColor = '#0ff';
    const g = ctx.createLinearGradient(b.x, b.y + 12, b.x, b.y - 12);
    g.addColorStop(0, 'rgba(0,255,255,0)');
    g.addColorStop(1, '#0ff');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, 3, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  enemyBullets.forEach(b => {
    ctx.shadowBlur  = 12 * quality.shadowScale;
    ctx.shadowColor = '#f50';
    ctx.fillStyle   = '#f84';
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, 4, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}

// ─────────────────────────────────────────────
//  ENEMIES
// ─────────────────────────────────────────────
const enemies = [];
let enemySpawnTimer = 0;
const ENEMY_TYPES = [
  { type: 'drone',   hp: 20, speed: 2.5, size: 18, color: '#f04', fireRate: 90,  score: 10,  xp: 10  },
  { type: 'gunship', hp: 50, speed: 1.8, color: '#f80', size: 26, fireRate: 60,  score: 30,  xp: 30  },
  { type: 'bomber',  hp: 80, speed: 1.0, color: '#c0f', size: 34, fireRate: 45,  score: 60,  xp: 60  },
  { type: 'boss',    hp: 300, speed: 1.2, color: '#ff0', size: 52, fireRate: 30, score: 300, xp: 300 },
];

function spawnEnemy(forcedType) {
  const pool  = wave < 3 ? [0, 0, 1] : wave < 5 ? [0, 1, 1, 2] : [0, 1, 2, 2, 3];
  const tData = forcedType != null ? ENEMY_TYPES[forcedType] : ENEMY_TYPES[pool[Math.floor(Math.random() * pool.length)]];
  enemies.push({
    ...tData,
    x: tData.size + Math.random() * (W - tData.size * 2),
    y: -tData.size,
    maxHp: tData.hp,
    angle: 0,
    fireCooldown: Math.floor(Math.random() * tData.fireRate),
    moveAngle: 0,
  });
}

function drawEnemy(e) {
  const { x, y, size, color, type, hp, maxHp } = e;
  ctx.save();
  ctx.translate(x, y);
  e.angle += 0.02;

  ctx.shadowBlur = 20 * quality.shadowScale;
  ctx.shadowColor = color;

  if (type === 'drone') {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, size);
    ctx.lineTo(-size, -size * 0.5);
    ctx.lineTo(0, -size * 0.5);
    ctx.lineTo(size, -size * 0.5);
    ctx.closePath(); ctx.fill();
    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f00';
    ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();

  } else if (type === 'gunship') {
    ctx.rotate(Math.PI);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.lineTo(-size * 0.8, size * 0.5);
    ctx.lineTo(-size * 0.3, size * 0.2);
    ctx.lineTo(0, size * 0.6);
    ctx.lineTo(size * 0.3, size * 0.2);
    ctx.lineTo(size * 0.8, size * 0.5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fff4';
    ctx.lineWidth = 1.5;
    ctx.stroke();

  } else if (type === 'bomber') {
    ctx.rotate(e.angle * 0.3);
    ctx.fillStyle = color;
    for (let i = 0; i < 6; i++) {
      ctx.rotate(Math.PI / 3);
      ctx.fillRect(-size * 0.25, 0, size * 0.5, size);
    }
    ctx.fillStyle = '#fff3';
    ctx.beginPath(); ctx.arc(0, 0, size * 0.4, 0, Math.PI * 2); ctx.fill();

  } else if (type === 'boss') {
    // Boss: multi-part
    ctx.rotate(e.angle * 0.15);
    // Outer ring
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.stroke();
    // Inner fill
    const bg = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.8);
    bg.addColorStop(0, '#fff2');
    bg.addColorStop(1, color + '44');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(0, 0, size * 0.8, 0, Math.PI * 2); ctx.fill();
    // Spikes
    for (let i = 0; i < 8; i++) {
      ctx.save();
      ctx.rotate((i / 8) * Math.PI * 2);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(-5, size * 0.75);
      ctx.lineTo(5, size * 0.75);
      ctx.lineTo(0, size * 1.3);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // Core
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.3);
    cg.addColorStop(0, '#fff');
    cg.addColorStop(1, color);
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0, 0, size * 0.3, 0, Math.PI * 2); ctx.fill();
  }

  ctx.shadowBlur = 0;
  ctx.restore();

  // HP Bar
  const bw = size * 2.2;
  ctx.fillStyle = '#300';
  ctx.fillRect(x - bw / 2, y - size - 10, bw, 5);
  const hpPct = hp / maxHp;
  const hpColor = hpPct > 0.5 ? '#0f0' : hpPct > 0.25 ? '#ff0' : '#f00';
  ctx.fillStyle = hpColor;
  ctx.shadowBlur = 6; ctx.shadowColor = hpColor;
  ctx.fillRect(x - bw / 2, y - size - 10, bw * hpPct, 5);
  ctx.shadowBlur = 0;
}

// ─────────────────────────────────────────────
//  POWER-UPS
// ─────────────────────────────────────────────
const powerUps = [];
const PU_TYPES = ['spread', 'rapid', 'shield', 'health'];

function spawnPowerUp(x, y) {
  if (Math.random() > 0.3) return;
  powerUps.push({
    x, y, vy: 1.5,
    type: PU_TYPES[Math.floor(Math.random() * PU_TYPES.length)],
    angle: 0,
  });
}

const PU_COLORS = { spread: '#f0f', rapid: '#0ff', shield: '#0f0', health: '#f44' };
const PU_ICONS  = { spread: '✦', rapid: '⚡', shield: '🛡', health: '♥' };

function drawPowerUps() {
  powerUps.forEach(p => {
    p.angle += 0.05;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    const color = PU_COLORS[p.type];
    ctx.shadowBlur = 20 * quality.shadowScale; ctx.shadowColor = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = color + '55';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();

    ctx.fillStyle = '#fff';
    ctx.font = '14px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(PU_ICONS[p.type], p.x, p.y);
  });
}

// ─────────────────────────────────────────────
//  HUD
// ─────────────────────────────────────────────
function drawHUD() {
  // HP Bar
  const bw = 180, bh = 14, bx = 20, by = H - 30;
  ctx.fillStyle = '#300';
  ctx.fillRect(bx, by, bw, bh);
  const hpG = ctx.createLinearGradient(bx, by, bx + bw, by);
  hpG.addColorStop(0, '#f00');
  hpG.addColorStop(1, '#0f0');
  ctx.fillStyle = hpG;
  ctx.shadowBlur = 8 * quality.shadowScale; ctx.shadowColor = '#0f0';
  ctx.fillRect(bx, by, bw * (player.hp / player.maxHp), bh);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#0f04';
  ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = '#fff';
  ctx.font = '10px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText(`HP  ${player.hp}/${player.maxHp}`, bx + 4, by + 11);

  // Power-up indicator
  if (player.powerUp) {
    const color = PU_COLORS[player.powerUp];
    ctx.shadowBlur = 10 * quality.shadowScale; ctx.shadowColor = color;
    ctx.fillStyle = color;
    ctx.font = '13px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(`▶ ${player.powerUp.toUpperCase()} (${Math.ceil(player.powerUpTimer / 60)}s)`, W / 2, H - 18);
    ctx.shadowBlur = 0;
  }

  // Score / Wave UI (DOM)
  ui.score.textContent = `SCORE: ${score}`;
  ui.wave.textContent = `WAVE: ${wave}`;
  const livesStr = '❤ '.repeat(lives).trim();
  ui.lives.textContent = livesStr || '☠';
}

// ─────────────────────────────────────────────
//  SCREENS
// ─────────────────────────────────────────────
function drawTitleScreen() {
  ctx.fillStyle = '#000d';
  ctx.fillRect(0, 0, W, H);

  // Title glow
  ctx.shadowBlur = 40; ctx.shadowColor = '#0ff';
  ctx.fillStyle = '#0ff';
  ctx.font = 'bold 64px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('NOVA STRIKE', W / 2, H / 2 - 80);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.font = '18px Courier New';
  ctx.fillText('A Sci-Fi Space Shooter', W / 2, H / 2 - 30);

  ctx.fillStyle = '#ff0';
  ctx.shadowBlur = 10; ctx.shadowColor = '#ff0';
  ctx.font = '20px Courier New';
  ctx.fillText('[ PRESS ENTER TO START ]', W / 2, H / 2 + 40);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#888';
  ctx.font = '14px Courier New';
  ctx.fillText('Move: Mouse   Fire: Click or SPACE   Pause: P', W / 2, H / 2 + 90);
}

function drawGameOverScreen() {
  ctx.fillStyle = '#000a';
  ctx.fillRect(0, 0, W, H);

  ctx.shadowBlur = 30; ctx.shadowColor = '#f00';
  ctx.fillStyle = '#f44';
  ctx.font = 'bold 56px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W / 2, H / 2 - 60);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.font = '22px Courier New';
  ctx.fillText(`FINAL SCORE: ${score}`, W / 2, H / 2);
  ctx.fillText(`WAVE REACHED: ${wave}`, W / 2, H / 2 + 40);

  ctx.fillStyle = '#ff0';
  ctx.shadowBlur = 8; ctx.shadowColor = '#ff0';
  ctx.font = '18px Courier New';
  ctx.fillText('[ PRESS ENTER TO RETRY ]', W / 2, H / 2 + 100);
  ctx.shadowBlur = 0;
}

function drawPauseScreen() {
  ctx.fillStyle = '#000a';
  ctx.fillRect(0, 0, W, H);
  ctx.shadowBlur = 20 * quality.shadowScale; ctx.shadowColor = '#0ff';
  ctx.fillStyle = '#0ff';
  ctx.font = 'bold 44px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('— PAUSED —', W / 2, H / 2);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#888';
  ctx.font = '16px Courier New';
  ctx.fillText('Press P to resume', W / 2, H / 2 + 50);
}

// ─────────────────────────────────────────────
//  COLLISION
// ─────────────────────────────────────────────
function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function checkCollisions() {
  // Bullets vs Enemies
  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    const b = bullets[bi];
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (dist(b, e) < e.size * 0.9) {
        bullets.splice(bi, 1);
        const dmg = player.powerUp === 'rapid' ? 12 : 10;
        e.hp -= dmg;
        spawnParticles(b.x, b.y, 6, { color: e.color, size: 3, decay: 0.05, maxSpeed: 3 });
        if (e.hp <= 0) {
          score += e.score;
          spawnParticles(e.x, e.y, 40, { color: e.color, size: 4, decay: 0.02, maxSpeed: 5 });
          spawnParticles(e.x, e.y, 20, { color: '#fff', size: 2, decay: 0.03, maxSpeed: 6 });
          spawnPowerUp(e.x, e.y);
          enemies.splice(ei, 1);
          screenShake(e.type === 'boss' ? 12 : 4, e.type === 'boss' ? 15 : 6);
          flashScreen(0.15);
        }
        break;
      }
    }
  }

  // Enemy bullets vs Player
  if (player.invincible > 0) return;
  for (let bi = enemyBullets.length - 1; bi >= 0; bi--) {
    const b = enemyBullets[bi];
    if (dist(b, player) < 20) {
      enemyBullets.splice(bi, 1);
      if (player.powerUp !== 'shield') {
        player.hp = Math.max(0, player.hp - 15);
        screenShake(6, 8);
        flashScreen(0.3);
        spawnParticles(player.x, player.y, 15, { color: '#f00', size: 3, decay: 0.04 });
        if (player.hp <= 0) handleDeath();
      }
    }
  }

  // Enemy vs Player
  enemies.forEach((e, ei) => {
    if (dist(e, player) < e.size + 20) {
      if (player.invincible <= 0 && player.powerUp !== 'shield') {
        player.hp = Math.max(0, player.hp - 30);
        screenShake(8, 10);
        flashScreen(0.4);
        spawnParticles(player.x, player.y, 25, { color: '#f44', size: 4, decay: 0.03 });
        player.invincible = 90;
        if (player.hp <= 0) handleDeath();
      }
    }
  });

  // Power-ups vs Player
  for (let i = powerUps.length - 1; i >= 0; i--) {
    const p = powerUps[i];
    if (dist(p, player) < 28) {
      powerUps.splice(i, 1);
      applyPowerUp(p.type);
    }
  }
}

function handleDeath() {
  lives--;
  if (lives <= 0) {
    gameOver = true;
    screenShake(20, 30);
    return;
  }
  player.hp = player.maxHp;
  player.invincible = 180;
  screenShake(10, 15);
}

function applyPowerUp(type) {
  const color = PU_COLORS[type];
  spawnParticles(player.x, player.y, 30, { color, size: 4, decay: 0.02, maxSpeed: 4 });
  if (type === 'health') {
    player.hp = Math.min(player.maxHp, player.hp + 40);
  } else {
    player.powerUp      = type;
    player.powerUpTimer = 600; // 10s
  }
}

// ─────────────────────────────────────────────
//  SCREEN EFFECTS
// ─────────────────────────────────────────────
function screenShake(amount, duration) {
  if (prefersReducedMotion) {
    amount *= 0.35;
    duration = Math.min(duration, 6);
  }
  shakeX = (Math.random() - 0.5) * amount;
  shakeY = (Math.random() - 0.5) * amount;
  shakeDuration = duration;
}
function flashScreen(alpha) {
  flashAlpha = alpha;
}

// ─────────────────────────────────────────────
//  GAME FLOW
// ─────────────────────────────────────────────
function startGame() {
  gameStarted = true;
}

function resetGame() {
  score = 0; lives = 3; wave = 1; gameOver = false;
  player.x = W / 2; player.y = H - 90;
  player.hp = player.maxHp;
  player.invincible = 0;
  player.powerUp = null;
  enemies.length = 0;
  bullets.length = 0;
  enemyBullets.length = 0;
  particles.length = 0;
  powerUps.length = 0;
  enemySpawnTimer = 0;
  gameStarted = true;
}

let waveTimer = 0;
let bossSpawned = false;

function updateWave() {
  waveTimer++;
  const interval = Math.max(40, 90 - wave * 8);
  if (waveTimer >= interval) {
    waveTimer = 0;
    const maxOnScreen = 3 + wave;
    if (enemies.length < maxOnScreen) {
      if (wave % 5 === 0 && !bossSpawned) {
        spawnEnemy(3);
        bossSpawned = true;
      } else {
        spawnEnemy();
      }
    }
  }
  // Advance wave
  if (score >= wave * 300) {
    wave++;
    bossSpawned = false;
    flashScreen(0.3);
  }
}

// ─────────────────────────────────────────────
//  MAIN UPDATE
// ─────────────────────────────────────────────
function update() {
  if (!gameStarted || paused || gameOver) return;

  frameCount++;

  // Player movement
  const targetX = Math.max(30, Math.min(W - 30, mouse.x));
  const targetY = Math.max(30, Math.min(H - 30, mouse.y));
  player.x += (targetX - player.x) * 0.12;
  player.y += (targetY - player.y) * 0.12;

  // Trail
  player.trail.unshift({ x: player.x, y: player.y });
  if (player.trail.length > 12) player.trail.pop();

  // Fire
  if (mouse.firing || keys['Space']) spawnBullet();
  if (player.fireCooldown > 0) player.fireCooldown--;

  // Invincibility
  if (player.invincible > 0) player.invincible--;

  // Power-up timer
  if (player.powerUpTimer > 0) {
    player.powerUpTimer--;
    if (player.powerUpTimer <= 0) player.powerUp = null;
  }

  // Stars
  updateStars();

  // Bullets
  bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
  for (let i = bullets.length - 1; i >= 0; i--) {
    if (bullets[i].y < -20 || bullets[i].x < -20 || bullets[i].x > W + 20) bullets.splice(i, 1);
  }

  // Enemy bullets
  enemyBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    if (b.y > H + 20 || b.x < -20 || b.x > W + 20) enemyBullets.splice(i, 1);
  }

  // Enemies
  enemies.forEach(e => {
    e.y += e.speed;
    e.moveAngle += 0.02;
    if (e.type !== 'boss') {
      e.x += Math.sin(e.moveAngle + e.x * 0.01) * 1.2;
      e.x = Math.max(e.size, Math.min(W - e.size, e.x));
    } else {
      // Boss hovers
      e.x += Math.sin(e.moveAngle) * 1.5;
      e.y = Math.max(100, Math.min(250, e.y));
      e.x = Math.max(e.size, Math.min(W - e.size, e.x));
    }

    // Enemy firing
    e.fireCooldown--;
    if (e.fireCooldown <= 0) {
      e.fireCooldown = e.fireRate;
      const angle = Math.atan2(player.y - e.y, player.x - e.x);
      const spd   = e.type === 'boss' ? 5 : 4;
      enemyBullets.push({ x: e.x, y: e.y + e.size, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd });
      if (e.type === 'boss') {
        // Boss shoots spread
        [-0.3, 0.3].forEach(offset => {
          enemyBullets.push({ x: e.x, y: e.y + e.size, vx: Math.cos(angle + offset) * spd, vy: Math.sin(angle + offset) * spd });
        });
      }
    }

    // Exhaust particles
    if (frameCount % 4 === 0) {
      spawnParticles(e.x, e.y - e.size, 2, {
        color: e.color, size: 2, decay: 0.06,
        maxSpeed: 1.5, minSpeed: 0.5
      });
    }
  });

  // Remove off-screen enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    if (enemies[i].y > H + enemies[i].size + 20) enemies.splice(i, 1);
  }

  // Power-ups
  powerUps.forEach(p => { p.y += p.vy; });
  for (let i = powerUps.length - 1; i >= 0; i--) {
    if (powerUps[i].y > H + 20) powerUps.splice(i, 1);
  }

  updateParticles();
  checkCollisions();
  updateWave();

  // Screen shake decay
  if (shakeDuration > 0) {
    shakeDuration--;
    shakeX = (Math.random() - 0.5) * (shakeDuration * 0.8);
    shakeY = (Math.random() - 0.5) * (shakeDuration * 0.8);
  } else {
    shakeX = shakeY = 0;
  }

  if (flashAlpha > 0) flashAlpha -= 0.02;
}

// ─────────────────────────────────────────────
//  MAIN DRAW
// ─────────────────────────────────────────────
function drawBloomPass() {
  if (!quality.bloom) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.16;
  ctx.filter = 'blur(7px) saturate(1.25)';
  // Keep bloom pass side-effect free: omit enemies/power-ups because their draw calls animate rotation.
  drawBullets();
  drawPlayer();
  ctx.filter = 'none';
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawVignetteAndToneMap() {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.18, W / 2, H / 2, H * 0.72);
  v.addColorStop(0, 'rgba(255,255,255,0.025)');
  v.addColorStop(0.62, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

function draw() {
  // Background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#000010');
  bg.addColorStop(1, '#000520');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  if (!gameStarted) { drawTitleScreen(); return; }

  // Apply screen shake
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawStars();
  drawBloomPass();
  drawParticles();
  drawPowerUps();
  drawBullets();
  enemies.forEach(e => drawEnemy(e));
  drawPlayer();
  drawHUD();

  drawVignetteAndToneMap();
  ctx.restore();

  // Flash overlay
  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(255,100,100,${Math.min(flashAlpha, 0.5)})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (paused)   drawPauseScreen();
  if (gameOver) drawGameOverScreen();
}

// ─────────────────────────────────────────────
//  GAME LOOP
// ─────────────────────────────────────────────
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
